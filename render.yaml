services:
  - type: web
    name: love-story-proposal
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ZEPTOMAIL_API_KEY
        sync: false
      - key: ZEPTOMAIL_SENDER
        value: noreply@app.aetechlabs.com
      - key: PEXELS_API_KEY
        sync: false
